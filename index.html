<!doctype html>
<!-- Treehouse Arcade hub. Last updated: 2026-11-11 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arcade">
<meta name="theme-color" content="#8fd3ff">
<title>Treehouse Arcade</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="app-180.png">
<link rel="icon" href="app-192.png">
<link rel="stylesheet" href="fonts.css">
<style>
/* Layout: a sky with a hanging plank sign, big sticker tiles for each game, a strip of grass along the bottom. */
:root{
  --sky:#8fd3ff; --sky-low:#d6f0ff; --grass:#6cc35a; --grass-deep:#4c8f47; --plank:#c58a5a; --plank-dark:#9a6538;
  --ink:#24304a; --paper:#fffaf0; --sun:#ffd23f; --muted:#66708c;
  --display:'Baloo 2', ui-rounded, 'Arial Rounded MT Bold', system-ui, sans-serif;
  --body:'Nunito', ui-rounded, system-ui, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--sky);color:var(--ink);font-family:var(--body);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{background:
  radial-gradient(120px 50px at 18% 16%,rgba(255,255,255,.9) 60%,transparent 62%),
  radial-gradient(90px 38px at 25% 13%,rgba(255,255,255,.9) 60%,transparent 62%),
  radial-gradient(140px 54px at 80% 26%,rgba(255,255,255,.85) 60%,transparent 62%),
  radial-gradient(100px 40px at 88% 22%,rgba(255,255,255,.85) 60%,transparent 62%),
  linear-gradient(var(--sky),var(--sky-low) 75%);background-attachment:fixed}
main{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;gap:36px;
  padding-block:calc(env(safe-area-inset-top,0px) + 28px) calc(env(safe-area-inset-bottom,0px) + 110px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sign{position:relative;margin-top:44px;background:repeating-linear-gradient(180deg,var(--plank) 0 34px,var(--plank-dark) 34px 38px);
  border:5px solid var(--ink);border-radius:18px;box-shadow:0 8px 0 var(--ink);padding:10px 34px 6px;transform:rotate(-1.5deg)}
.sign::before,.sign::after{content:"";position:absolute;top:-50px;width:5px;height:50px;background:var(--ink)}
.sign::before{left:18%} .sign::after{right:18%}
.sign h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(40px,8vw,72px);line-height:1;color:var(--paper);
  text-shadow:0 4px 0 var(--ink);-webkit-text-stroke:2px var(--ink);text-wrap:balance;text-align:center}
.grid{width:100%;max-width:980px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,250px));justify-content:center;gap:28px}
.tile{display:flex;flex-direction:column;align-items:center;gap:10px;text-decoration:none;color:var(--ink);background:var(--paper);
  border:5px solid var(--ink);border-radius:30px;box-shadow:0 8px 0 var(--ink);padding:16px 16px 14px;transition:transform .08s,box-shadow .08s}
.tile:active{transform:translateY(6px);box-shadow:0 2px 0 var(--ink)}
.tile:focus-visible{outline:5px solid var(--sun);outline-offset:4px}
.tile img{width:100%;max-width:100%;aspect-ratio:1;border-radius:22px;border:4px solid var(--ink);display:block}
.tile span{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1;text-align:center}
.tile small{font-weight:800;font-size:14px;color:var(--muted);margin-top:-6px}
.stamp{font-weight:800;font-size:14px;color:var(--muted);background:rgba(255,250,240,.7);border-radius:999px;padding:4px 12px}
.tile.soon{background:rgba(255,250,240,.55);border-style:dashed;box-shadow:none;justify-content:center;pointer-events:none}
.tile.soon .ph{width:100%;aspect-ratio:1;border-radius:22px;border:4px dashed rgba(36,48,74,.45);display:grid;place-items:center;font-family:var(--display);font-size:64px;font-weight:800;color:rgba(36,48,74,.35)}
.tile.soon span{color:var(--muted)}
.grass{position:fixed;left:0;right:0;bottom:0;height:calc(env(safe-area-inset-bottom,0px) + 80px);background:var(--grass);border-top:5px solid var(--ink);z-index:0}
main{position:relative;z-index:1}
.grass::before{content:"";position:absolute;left:0;right:0;top:-22px;height:22px;
  background:radial-gradient(14px 22px at 14px 22px,var(--grass) 98%,transparent) 0 0/28px 22px repeat-x}
@media (prefers-reduced-motion: reduce){.tile{transition:none}}
</style>
</head>
<body>
<main>
  <div class="sign"><h1>Treehouse Arcade</h1></div>
  <nav class="grid" id="grid" aria-label="Games"></nav>
  <p class="stamp" id="stamp"></p>
</main>
<div class="grass"></div>
<script src="games.js"></script>
<script>
const grid=document.getElementById('grid');
const nice=d=>{try{return new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}catch(e){return d}};
for(const g of self.ARCADE_GAMES){
  const a=document.createElement('a');a.className='tile';a.href=g.page;
  a.innerHTML=`<img src="${g.icon}" alt="" style="background:${g.color}"><span>${g.name}</span>`+(g.updated?`<small>Updated ${nice(g.updated)}</small>`:'');
  grid.appendChild(a);
}
const soon=document.createElement('div');soon.className='tile soon';soon.innerHTML='<div class="ph">+</div><span>More games soon</span>';grid.appendChild(soon);
document.getElementById('stamp').textContent=`Arcade updated ${nice(self.ARCADE_UPDATED)} · version ${self.ARCADE_VERSION}`;
document.addEventListener('gesturestart',e=>e.preventDefault());
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
</body>
</html>
